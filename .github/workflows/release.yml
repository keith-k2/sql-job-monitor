name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Install WiX and cargo-wix
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          $wix = Join-Path $env:RUNNER_TEMP "wix314"
          New-Item -ItemType Directory -Force $wix | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile (Join-Path $env:RUNNER_TEMP "wix.zip") `
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          Expand-Archive (Join-Path $env:RUNNER_TEMP "wix.zip") $wix
          "WIX_BIN=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BinPath $env:WIX_BIN
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sql-job-monitor-windows
          path: dist/*.msi
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "SQL Job Monitor $env:GITHUB_REF_NAME" --notes "Windows, macOS, and Linux installers for this version."
          }
          gh release upload $env:GITHUB_REF_NAME dist/*.msi --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test
        run: cargo test
      - name: Build universal binary
        run: |
          chmod +x scripts/read-version.sh scripts/package-macos.sh
          version="$(scripts/read-version.sh)"
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/sql-job-monitor \
            target/aarch64-apple-darwin/release/sql-job-monitor \
            target/x86_64-apple-darwin/release/sql-job-monitor
          scripts/package-macos.sh --binary target/release/sql-job-monitor --version "$version"
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: sql-job-monitor-macos
          path: dist/*.dmg
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "SQL Job Monitor ${GITHUB_REF_NAME}" --notes "Windows, macOS, and Linux installers for this version."
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev pkg-config
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Fetch appimagetool
        run: |
          mkdir -p "$RUNNER_TEMP/appimagetool"
          curl -L --fail -o "$RUNNER_TEMP/appimagetool/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool/appimagetool.AppImage"
          cd "$RUNNER_TEMP/appimagetool"
          ./appimagetool.AppImage --appimage-extract
          ln -sf squashfs-root/AppRun appimagetool
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool/appimagetool" >> "$GITHUB_ENV"
      - name: Package
        run: |
          chmod +x scripts/read-version.sh scripts/package-linux.sh packaging/linux/AppRun
          scripts/package-linux.sh
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: sql-job-monitor-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "SQL Job Monitor ${GITHUB_REF_NAME}" --notes "Windows, macOS, and Linux installers for this version."
          gh release upload "${GITHUB_REF_NAME}" dist/*.AppImage dist/*.tar.gz --clobber
